name: build-inveigh

# Packages Inveigh from the pinned official source ref (see
# tools/inveigh/source.md). Inveigh is PowerShell (plus an optional
# C# assembly), not something this repo compiles - the source tree is
# zipped as-is and published as a signed + attested GitHub Release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git commit/tag of Kevin-Robertson/Inveigh to build"
        required: true
        default: "7aea2e7213c9e89ad13fb132d048cf589c6a03f7"
      skip_release:
        description: "Skip this tool's own release publish - build-all sets this and publishes once at the end instead"
        type: boolean
        default: false
  # Lets build-all.yml (or any other workflow) call this one directly.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        default: "7aea2e7213c9e89ad13fb132d048cf589c6a03f7"
      skip_release:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  UPSTREAM_REPO: Kevin-Robertson/Inveigh
  TOOL_NAME: inveigh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream source at pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref }}
          path: src

      - name: Record exact commit built
        run: echo "UPSTREAM_COMMIT=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package source tree
        run: |
          mkdir -p out
          rm -rf src/.git
          cd src
          zip -r -X "../out/${{ env.TOOL_NAME }}-source.zip" .

      - name: Checksum
        run: |
          cd out
          sha256sum * > "${{ env.TOOL_NAME }}-source.sha256"
          cat *.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "out/${{ env.TOOL_NAME }}-source*"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-source
          path: out/*

  release:
    needs: build
    if: ${{ success() && inputs.skip_release != true }}
    runs-on: ubuntu-latest
    # All tool workflows publish into the same "latest" release. Serialize
    # so two tools building at the same time don't race on the same tag.
    concurrency:
      group: trustbin-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update release changelog
        id: changelog
        uses: ./.github/actions/log-release
        with:
          tool: ${{ env.TOOL_NAME }}
          ref: ${{ inputs.ref }}
          repo: ${{ env.UPSTREAM_REPO }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the shared "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "trustbin: latest verified builds"
          make_latest: "true"
          body_path: ${{ steps.changelog.outputs.body-path }}
          files: |
            dist/*
