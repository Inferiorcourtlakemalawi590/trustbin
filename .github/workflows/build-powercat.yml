name: build-powercat

# Packages powercat from the pinned official source ref (see
# tools/powercat/source.md). powercat is a single PowerShell script,
# not something this repo compiles - the file is published as-is,
# signed + attested, as a GitHub Release asset.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git commit/tag of besimorhino/powercat to build"
        required: true
        default: "4e33fdfa2850a8940e46d0b69250ae3ba3a8c640"
      skip_release:
        description: "Skip this tool's own release publish - build-all sets this and publishes once at the end instead"
        type: boolean
        default: false
  # Lets build-all.yml (or any other workflow) call this one directly.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        default: "4e33fdfa2850a8940e46d0b69250ae3ba3a8c640"
      skip_release:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  UPSTREAM_REPO: besimorhino/powercat
  TOOL_NAME: powercat

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream source at pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref }}
          path: src

      - name: Record exact commit built
        run: echo "UPSTREAM_COMMIT=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Stage artifact
        run: |
          mkdir -p out
          cp src/powercat.ps1 "out/${{ env.TOOL_NAME }}.ps1"

      - name: Checksum
        run: |
          cd out
          sha256sum * > "${{ env.TOOL_NAME }}.sha256"
          cat *.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "out/${{ env.TOOL_NAME }}*"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}
          path: out/*

  release:
    needs: build
    if: ${{ success() && inputs.skip_release != true }}
    runs-on: ubuntu-latest
    # All tool workflows publish into the same "latest" release. Serialize
    # so two tools building at the same time don't race on the same tag.
    concurrency:
      group: trustbin-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update release changelog
        id: changelog
        uses: ./.github/actions/log-release
        with:
          tool: ${{ env.TOOL_NAME }}
          ref: ${{ inputs.ref }}
          repo: ${{ env.UPSTREAM_REPO }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the shared "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "trustbin: latest verified builds"
          make_latest: "true"
          body_path: ${{ steps.changelog.outputs.body-path }}
          files: |
            dist/*
