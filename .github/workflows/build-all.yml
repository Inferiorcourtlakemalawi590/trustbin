name: build-all

# Runs every tool's build workflow in one click instead of triggering each
# one by hand. Each job below calls the matching build-<tool>.yml as a
# reusable workflow with its default pinned ref. To build a different ref
# for one tool, run that tool's own workflow directly instead of this one.
#
# Tools run in three waves (gated by the wave*_gate jobs) rather than all
# at once, to stay under the account's runner concurrency limit. Each
# gate and wave-2/3 job carries `if: always()` / `if: ${{ !cancelled() }}`
# so a failure or cancellation in one tool cannot skip unrelated tools
# downstream.
#
# Publishing is centralized in the final `publish` job rather than each
# tool workflow publishing its own binary. Every build-<tool>.yml's
# release job shares the same `trustbin-latest-release` concurrency
# group, which serializes updates to the release but only holds one
# queued job at a time; sixteen release jobs arriving together would
# drop most of them. Passing `skip_release: true` to every tool here
# turns off each one's own publish step, and `publish` does it once at
# the end for everything that succeeded.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # --- wave 1: original tools ---
  chisel:
    uses: ./.github/workflows/build-chisel.yml
    with:
      ref: "v1.11.8"
      skip_release: true

  rusthound:
    uses: ./.github/workflows/build-rusthound.yml
    with:
      ref: "v2.4.92"
      skip_release: true

  lazagne:
    uses: ./.github/workflows/build-lazagne.yml
    with:
      ref: "v2.4.7"
      skip_release: true

  netcat:
    uses: ./.github/workflows/build-netcat.yml
    with:
      ref: "7c1219817a9ce483dfb646f0bbe33537240303eb"
      skip_release: true

  # if: always() so one failed tool in wave 1 doesn't skip every
  # unrelated tool in waves 2/3 - the gate only exists to cap peak
  # concurrency, not to make tools depend on each other.
  wave2_gate:
    needs: [chisel, rusthound, lazagne, netcat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "wave 1 done"

  # --- wave 2: C# tools (MSBuild, windows-latest) ---
  certify:
    needs: wave2_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-certify.yml
    with:
      ref: "b63f21d1be13addc6aebfa145f6a76815c756ddb"
      skip_release: true

  rubeus:
    needs: wave2_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-rubeus.yml
    with:
      ref: "1.6.4"
      skip_release: true

  seatbelt:
    needs: wave2_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-seatbelt.yml
    with:
      ref: "392171df84472591d4eae7ebd5b1cdc96ba91377"
      skip_release: true

  sharpup:
    needs: wave2_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-sharpup.yml
    with:
      ref: "8a7579174ed447181835cb82bf2ec0279e9110d0"
      skip_release: true

  sharpersist:
    needs: wave2_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-sharpersist.yml
    with:
      ref: "01fb8bb22cdea29f6d0dce2fd28698f4edfffdb9"
      skip_release: true

  godpotato:
    needs: wave2_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-godpotato.yml
    with:
      ref: "59f66583474fb0297b7447551460e1072de324c0"
      skip_release: true

  mimikatz:
    needs: wave2_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-mimikatz.yml
    with:
      ref: "306bc6b43099c7b698f2898401fddbded6a630c8"
      skip_release: true

  wave3_gate:
    needs:
      [certify, rubeus, seatbelt, sharpup, sharpersist, godpotato, mimikatz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "wave 2 done"

  # --- wave 3: PowerShell tools (packaged as-is, ubuntu-latest) ---
  inveigh:
    needs: wave3_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-inveigh.yml
    with:
      ref: "7aea2e7213c9e89ad13fb132d048cf589c6a03f7"
      skip_release: true

  mailsniper:
    needs: wave3_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-mailsniper.yml
    with:
      ref: "1d5563697105e81faa5825d588362f67549db60a"
      skip_release: true

  powerlurk:
    needs: wave3_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-powerlurk.yml
    with:
      ref: "ddfa8fb02ddbc19469fdc5314fd764d0a801fbce"
      skip_release: true

  powersharppack:
    needs: wave3_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-powersharppack.yml
    with:
      ref: "c0c7f6f9f775a02e1c86e543afcabfba4aa7e887"
      skip_release: true

  powersploit:
    needs: wave3_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-powersploit.yml
    with:
      ref: "d943001a7defb5e0d1657085a77a0e78609be58f"
      skip_release: true

  powercat:
    needs: wave3_gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-powercat.yml
    with:
      ref: "4e33fdfa2850a8940e46d0b69250ae3ba3a8c640"
      skip_release: true

  # --- publish everything that succeeded, once ---
  publish:
    needs:
      [
        chisel,
        rusthound,
        lazagne,
        netcat,
        certify,
        rubeus,
        seatbelt,
        sharpup,
        sharpersist,
        godpotato,
        mimikatz,
        inveigh,
        mailsniper,
        powerlurk,
        powersharppack,
        powersploit,
        powercat,
      ]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: trustbin-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Only the tools that actually succeeded go in BUILDS_JSON, so a
      # failed/skipped tool doesn't get a false changelog entry (and its
      # stale artifact, if any, from a previous successful run stays the
      # one that's published - download-artifact only pulls what THIS
      # run's jobs uploaded, so a failed tool simply contributes nothing
      # to `dist/` this time either).
      - name: Update release changelog and publish
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS_JSON: |
            {
              "chisel": {"result": "${{ needs.chisel.result }}", "ref": "v1.11.8", "repo": "jpillora/chisel"},
              "rusthound": {"result": "${{ needs.rusthound.result }}", "ref": "v2.4.92", "repo": "g0h4n/RustHound-CE"},
              "lazagne": {"result": "${{ needs.lazagne.result }}", "ref": "v2.4.7", "repo": "AlessandroZ/LaZagne"},
              "netcat": {"result": "${{ needs.netcat.result }}", "ref": "7c1219817a9ce483dfb646f0bbe33537240303eb", "repo": "diegocr/netcat"},
              "certify": {"result": "${{ needs.certify.result }}", "ref": "b63f21d1be13addc6aebfa145f6a76815c756ddb", "repo": "GhostPack/Certify"},
              "rubeus": {"result": "${{ needs.rubeus.result }}", "ref": "1.6.4", "repo": "GhostPack/Rubeus"},
              "seatbelt": {"result": "${{ needs.seatbelt.result }}", "ref": "392171df84472591d4eae7ebd5b1cdc96ba91377", "repo": "GhostPack/Seatbelt"},
              "sharpup": {"result": "${{ needs.sharpup.result }}", "ref": "8a7579174ed447181835cb82bf2ec0279e9110d0", "repo": "GhostPack/SharpUp"},
              "sharpersist": {"result": "${{ needs.sharpersist.result }}", "ref": "01fb8bb22cdea29f6d0dce2fd28698f4edfffdb9", "repo": "mandiant/SharPersist"},
              "godpotato": {"result": "${{ needs.godpotato.result }}", "ref": "59f66583474fb0297b7447551460e1072de324c0", "repo": "BeichenDream/GodPotato"},
              "mimikatz": {"result": "${{ needs.mimikatz.result }}", "ref": "306bc6b43099c7b698f2898401fddbded6a630c8", "repo": "gentilkiwi/mimikatz"},
              "inveigh": {"result": "${{ needs.inveigh.result }}", "ref": "7aea2e7213c9e89ad13fb132d048cf589c6a03f7", "repo": "Kevin-Robertson/Inveigh"},
              "mailsniper": {"result": "${{ needs.mailsniper.result }}", "ref": "1d5563697105e81faa5825d588362f67549db60a", "repo": "dafthack/MailSniper"},
              "powerlurk": {"result": "${{ needs.powerlurk.result }}", "ref": "ddfa8fb02ddbc19469fdc5314fd764d0a801fbce", "repo": "Sw4mpf0x/PowerLurk"},
              "powersharppack": {"result": "${{ needs.powersharppack.result }}", "ref": "c0c7f6f9f775a02e1c86e543afcabfba4aa7e887", "repo": "S3cur3Th1sSh1t/PowerSharpPack"},
              "powersploit": {"result": "${{ needs.powersploit.result }}", "ref": "d943001a7defb5e0d1657085a77a0e78609be58f", "repo": "PowerShellMafia/PowerSploit"},
              "powercat": {"result": "${{ needs.powercat.result }}", "ref": "4e33fdfa2850a8940e46d0b69250ae3ba3a8c640", "repo": "besimorhino/powercat"}
            }
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess

          results = json.loads(os.environ["RESULTS_JSON"])
          builds = [
              {"tool": tool, "ref": v["ref"], "repo": v["repo"]}
              for tool, v in results.items()
              if v["result"] == "success"
          ]
          print(f"Logging {len(builds)}/{len(results)} tools that succeeded this run.")

          env = os.environ.copy()
          env["BUILDS_JSON"] = json.dumps(builds)
          subprocess.run(["python3", "scripts/render_release_log.py"], check=True, env=env)
          PYEOF

      - name: Publish to the shared "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "trustbin: latest verified builds"
          make_latest: "true"
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            dist/*
