name: build-mimikatz

# Compiles mimikatz from the pinned official source ref (see
# tools/mimikatz/source.md) for Windows (Win32 + x64), and publishes the
# binaries as signed + attested GitHub Release assets.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git commit/tag of gentilkiwi/mimikatz to build"
        required: true
        default: "306bc6b43099c7b698f2898401fddbded6a630c8"
      skip_release:
        description: "Skip this tool's own release publish - build-all sets this and publishes once at the end instead"
        type: boolean
        default: false
  # Lets build-all.yml (or any other workflow) call this one directly.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        default: "306bc6b43099c7b698f2898401fddbded6a630c8"
      skip_release:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  UPSTREAM_REPO: gentilkiwi/mimikatz
  TOOL_NAME: mimikatz

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            asset_suffix: windows-x86_64
          - platform: Win32
            asset_suffix: windows-x86
    steps:
      - name: Clone upstream source at pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref }}
          path: src

      - name: Record exact commit built
        shell: bash
        run: echo "UPSTREAM_COMMIT=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # mimikatz.vcxproj forces PlatformToolset to a Windows-XP-compatible
      # value no longer shipped by Visual Studio. Strip those lines from
      # the checked-out project file (CI workspace only) so MSBuild falls
      # back to whatever toolset is actually installed.
      - name: Drop the unavailable Windows XP toolset override
        shell: pwsh
        working-directory: src
        run: |
          $path = "mimikatz\mimikatz.vcxproj"
          $lines = Get-Content $path
          $filtered = $lines | Where-Object {
            $_ -notmatch '<PlatformToolset>v100</PlatformToolset>' -and $_ -notmatch '_xp</PlatformToolset>'
          }
          Set-Content -Path $path -Value $filtered

      # With no explicit toolset, MSBuild's own default resolution still
      # lands on an unavailable value. The real installed toolset lives
      # under Platforms\x64\PlatformToolsets\<toolset>\, one level below
      # the version folder MSBuild reports - detect it from disk rather
      # than hardcoding a value a future runner image update would break.
      - name: Detect the installed platform toolset
        id: toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstallPath = & $vswhere -latest -property installationPath
          $vcRoot = Join-Path $vsInstallPath "MSBuild\Microsoft\VC"
          $vcVersionDir = Get-ChildItem $vcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $toolsetsDir = Join-Path $vcVersionDir.FullName "Platforms\x64\PlatformToolsets"
          $toolset = Get-ChildItem $toolsetsDir -Directory |
            Where-Object { $_.Name -match '^v\d+$' } |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          "toolset=$toolset" >> $env:GITHUB_OUTPUT

      # Builds only the mimikatz project, not the full solution: mimidrv
      # and mimilove both need the Windows Driver Kit 7.1. Upstream's own
      # README states mimikatz and mimilib build fine without it.
      #
      # IncludePath is $(SolutionDir)inc;..., normally set by MSBuild
      # when building through mimikatz.sln. Pass it explicitly since the
      # .vcxproj is built directly.
      - name: Build release binary
        working-directory: src
        shell: pwsh
        run: >
          msbuild "mimikatz\mimikatz.vcxproj"
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=${{ steps.toolset.outputs.toolset }}
          /p:SolutionDir="$($PWD.Path)\"
          /clp:ErrorsOnly

      # Confirms the binary actually runs, not just that it compiled.
      - name: Smoke test the built binary
        shell: pwsh
        run: |
          $exe = "src\${{ matrix.platform }}\mimikatz.exe"
          $output = & $exe "version" "exit" 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "mimikatz.exe exited with code $LASTEXITCODE" }
          if ($output -notmatch "mimikatz") { throw "Output didn't contain the expected banner" }

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "src/${{ matrix.platform }}/mimikatz.exe" \
             "out/${{ env.TOOL_NAME }}-${{ matrix.asset_suffix }}.exe"

      - name: Checksum
        shell: bash
        run: |
          cd out
          sha256sum * > "${{ env.TOOL_NAME }}-${{ matrix.asset_suffix }}.sha256"
          cat *.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "out/${{ env.TOOL_NAME }}-${{ matrix.asset_suffix }}*"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-${{ matrix.asset_suffix }}
          path: out/*

  release:
    needs: build
    if: ${{ success() && inputs.skip_release != true }}
    runs-on: ubuntu-latest
    # All tool workflows publish into the same "latest" release. Serialize
    # so two tools building at the same time don't race on the same tag.
    concurrency:
      group: trustbin-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update release changelog
        id: changelog
        uses: ./.github/actions/log-release
        with:
          tool: ${{ env.TOOL_NAME }}
          ref: ${{ inputs.ref }}
          repo: ${{ env.UPSTREAM_REPO }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the shared "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "trustbin: latest verified builds"
          make_latest: "true"
          body_path: ${{ steps.changelog.outputs.body-path }}
          files: |
            dist/*
