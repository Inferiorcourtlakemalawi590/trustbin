name: build-godpotato

# Compiles GodPotato from the pinned official source ref (see
# tools/godpotato/source.md) for Windows, and publishes the binary as
# a signed + attested GitHub Release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git commit/tag of BeichenDream/GodPotato to build"
        required: true
        default: "59f66583474fb0297b7447551460e1072de324c0"
      skip_release:
        description: "Skip this tool's own release publish - build-all sets this and publishes once at the end instead"
        type: boolean
        default: false
  # Lets build-all.yml (or any other workflow) call this one directly.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        default: "59f66583474fb0297b7447551460e1072de324c0"
      skip_release:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  UPSTREAM_REPO: BeichenDream/GodPotato
  TOOL_NAME: godpotato
  CSPROJ_PATH: src/GodPotato.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone upstream source at pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref }}
          path: src

      - name: Record exact commit built
        shell: bash
        run: echo "UPSTREAM_COMMIT=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # Upstream's csproj declares OutputType=Library (it's normally
      # loaded as an assembly rather than run standalone). Override it
      # at the command line to produce a standalone .exe, matching how
      # the tool is documented and commonly used. The source file
      # itself is never modified.
      # No .sln here (single standalone .csproj), so MSBuild doesn't do the
      # usual solution-level "Any CPU" -> "AnyCPU" platform translation.
      # Passing /p:Platform="Any CPU" (with the space) doesn't match the
      # csproj's own `'$(Configuration)|$(Platform)' == 'Release|AnyCPU'`
      # condition, which leaves BaseOutputPath/OutputPath unset and fails
      # the build. Omit /p:Platform entirely and let it default to AnyCPU
      # (the csproj's own default), which does match.
      - name: Build release binary
        run: >
          msbuild "${{ env.CSPROJ_PATH }}"
          /p:Configuration=Release
          /p:OutputType=Exe
          /clp:ErrorsOnly

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp src/bin/Release/*.exe \
             "out/${{ env.TOOL_NAME }}-windows-x86_64.exe"

      - name: Checksum
        shell: bash
        run: |
          cd out
          sha256sum * > "${{ env.TOOL_NAME }}-windows-x86_64.sha256"
          cat *.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "out/${{ env.TOOL_NAME }}-windows-x86_64*"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-windows-x86_64
          path: out/*

  release:
    needs: build
    if: ${{ success() && inputs.skip_release != true }}
    runs-on: ubuntu-latest
    # All tool workflows publish into the same "latest" release. Serialize
    # so two tools building at the same time don't race on the same tag.
    concurrency:
      group: trustbin-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update release changelog
        id: changelog
        uses: ./.github/actions/log-release
        with:
          tool: ${{ env.TOOL_NAME }}
          ref: ${{ inputs.ref }}
          repo: ${{ env.UPSTREAM_REPO }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the shared "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "trustbin: latest verified builds"
          make_latest: "true"
          body_path: ${{ steps.changelog.outputs.body-path }}
          files: |
            dist/*
