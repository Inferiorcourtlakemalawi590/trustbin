name: "Log tool build to the shared release changelog"
description: >
  Regenerates the shared "latest" release body via
  scripts/render_release_log.py: a static header plus a "## Recent
  builds" changelog grouped into one collapsible <details> block per
  day, each entry linking "built from <ref>" to the exact commit/tag on
  the tool's official upstream repo. Only logs a new line when there's
  actually something to say - the tool's first appearance, or its ref
  changed since the last entry for that tool - so rebuilding the same
  ref again doesn't add a duplicate.

inputs:
  tool:
    description: "Tool name (matches env.TOOL_NAME in the calling workflow)"
    required: true
  ref:
    description: "Upstream ref/tag/commit this build was made from"
    required: true
  repo:
    description: "Upstream org/repo this build was made from (matches env.UPSTREAM_REPO), e.g. GhostPack/Rubeus"
    required: true
  github-token:
    description: "Token used to read the current release body via gh"
    required: true

outputs:
  body-path:
    description: "Path to the generated release body file, for body_path:"
    value: ${{ steps.build-body.outputs.path }}

runs:
  using: "composite"
  steps:
    - id: build-body
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TOOL: ${{ inputs.tool }}
        REF: ${{ inputs.ref }}
        REPO: ${{ inputs.repo }}
      run: python3 scripts/render_release_log.py
